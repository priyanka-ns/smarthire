spring.application.name=smarthire-backend

# Server port (Render/Railway set $PORT)
server.port=${PORT:8080}

# Anthropic API key — set via environment variable, never commit it.
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Claude model (see https://platform.claude.com for options)
smarthire.model=${CLAUDE_MODEL:claude-opus-4-6}

# Comma-separated allowed CORS origins for /api/** (default: any)
smarthire.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
